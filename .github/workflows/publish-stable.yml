name: Publish stable
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-stable
  cancel-in-progress: false

jobs:
  npm:
    name: npm
    runs-on: ubuntu-latest
    if: github.repository_owner == 'wolvesvillejs'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install node.js v24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Resolve and verify version
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(jq --raw-output '.version' package.json)

          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}." \
                 "Bump package.json to ${TAG_VERSION} (or retag) before releasing."
            exit 1
          fi

          if [ -n "$(npm view "wolvesville.js@${PKG_VERSION}" version 2>/dev/null || true)" ]; then
            echo "::error::wolvesville.js@${PKG_VERSION} is already published to npm."
            exit 1
          fi

          echo "value=${PKG_VERSION}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npx eslint src

      - name: Publish
        run: npm publish --tag latest

      - name: Summary
        run: echo "Published wolvesville.js@${{ steps.version.outputs.value }} to the latest tag." >> $GITHUB_STEP_SUMMARY
