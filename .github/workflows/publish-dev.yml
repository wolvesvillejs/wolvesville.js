name: Publish dev

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-dev
  cancel-in-progress: false

jobs:
  npm:
    name: npm
    runs-on: ubuntu-latest
    if: github.repository_owner == 'wolvesvillejs'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Resolve dev version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          BASE_VERSION="$(jq --raw-output '.version' package.json)"

          if ! echo "$BASE_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::package.json version '${BASE_VERSION}' must be a plain X.Y.Z version."
            exit 1
          fi

          if [ -n "$(npm view "wolvesville.js@${BASE_VERSION}" version 2>/dev/null || true)" ]; then
            echo "::error::wolvesville.js@${BASE_VERSION} is already published as stable."
            echo "::error::Bump package.json to the next unreleased version."
            exit 1
          fi

          SHORT_SHA="$(git rev-parse --short HEAD)"
          PUBLISHED="$(npm view wolvesville.js@dev version 2>/dev/null || true)"

          case "$PUBLISHED" in
            "${BASE_VERSION}-dev."*"."${SHORT_SHA}")
              echo "Commit ${SHORT_SHA} is already the current dev release (${PUBLISHED})."
              echo "release=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              DEV_VERSION="${BASE_VERSION}-dev.${GITHUB_RUN_ID}.${SHORT_SHA}"

              echo "Publishing ${DEV_VERSION}"
              echo "release=true" >> "$GITHUB_OUTPUT"
              echo "value=${DEV_VERSION}" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Install dependencies
        if: steps.version.outputs.release == 'true'
        run: npm ci

      - name: Run linter
        if: steps.version.outputs.release == 'true'
        run: npx eslint src

      - name: Set package version
        if: steps.version.outputs.release == 'true'
        run: npm pkg set version="${{ steps.version.outputs.value }}"

      - name: Publish
        if: steps.version.outputs.release == 'true'
        run: npm publish --provenance --tag dev
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        if: steps.version.outputs.release == 'true'
        run: |
          echo "Published wolvesville.js@${{ steps.version.outputs.value }} to the dev tag." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: steps.version.outputs.release != 'true'
        run: |
          echo "Current dev tag already points to this commit; nothing to publish." \
            >> "$GITHUB_STEP_SUMMARY"
