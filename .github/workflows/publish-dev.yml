name: Publish dev
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

permissions:
  contents: read

concurrency:
  group: publish-dev
  cancel-in-progress: false

jobs:
  npm:
    name: npm
    runs-on: ubuntu-latest
    if: github.repository_owner == 'wolvesvillejs'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Resolve dev version
        id: version
        run: |
          BASE_VERSION=$(jq --raw-output '.version' package.json)

          if ! echo "$BASE_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::package.json version '${BASE_VERSION}' must be a plain X.Y.Z version." \
                 "Dev builds are prereleases of the next unreleased version."
            exit 1
          fi

          if [ -n "$(npm view "wolvesville.js@${BASE_VERSION}" version 2>/dev/null || true)" ]; then
            echo "::error::wolvesville.js@${BASE_VERSION} is already published as stable." \
                 "Bump package.json to the next unreleased version."
            exit 1
          fi

          SHORT_SHA=$(git rev-parse --short HEAD)
          PUBLISHED=$(npm view wolvesville.js@dev version 2>/dev/null || true)

          case "$PUBLISHED" in
            "${BASE_VERSION}-dev."*".${SHORT_SHA}")
              echo "Commit ${SHORT_SHA} is already published as ${PUBLISHED}; nothing to do."
              echo "release=false" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "release=true" >> $GITHUB_OUTPUT
              echo "value=${BASE_VERSION}-dev.$(date +%s).${SHORT_SHA}" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Install dependencies
        if: steps.version.outputs.release == 'true'
        run: npm ci

      - name: Publish
        if: steps.version.outputs.release == 'true'
        run: |
          npm pkg set version="${{ steps.version.outputs.value }}"
          npm publish --tag dev
        env:
          NODE_AUTH_TOKEN: ${{ secrets.WJS_PUBLISH }}

      - name: Summary
        if: steps.version.outputs.release == 'true'
        run: echo "Published wolvesville.js@${{ steps.version.outputs.value }} to the dev tag." >> $GITHUB_STEP_SUMMARY
